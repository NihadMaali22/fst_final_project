version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: log_service_db
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_password
      POSTGRES_DB: logs_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=640MB
      -c work_mem=32MB
      -c maintenance_work_mem=128MB
      -c temp_buffers=16MB
      -c synchronous_commit=off
      -c wal_buffers=16MB
      -c max_wal_size=2GB
      -c min_wal_size=512MB
      -c checkpoint_completion_target=0.9
      -c checkpoint_timeout=15min
      -c max_parallel_workers_per_gather=2
      -c max_parallel_workers=4
      -c parallel_tuple_cost=0.001
      -c parallel_setup_cost=100
      -c gin_pending_list_limit=128MB
      -c autovacuum_naptime=30s
      -c autovacuum_vacuum_scale_factor=0.01
      -c autovacuum_vacuum_cost_delay=2ms
      -c autovacuum_vacuum_cost_limit=1000
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c default_statistics_target=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs_user -d logs_db"]
      interval: 2s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: log_service_app
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://logs_user:logs_password@db:5432/logs_db
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      LOADGEN_API_KEY: ${LOADGEN_API_KEY:-}
      WRITE_FLUSH_INTERVAL_MS: 50
      WRITE_FLUSH_SIZE: 5000
      WRITE_CONCURRENCY: 3
      READ_POOL_SIZE: 5
      WRITE_POOL_SIZE: 3
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

volumes:
  pgdata:
