name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Docker Compose (AUTH_ENABLED=false)
        run: |
          docker compose up -d --build
          npm run test:smoke || (docker compose logs && exit 1)
          docker compose down -v

      - name: Run Docker Compose (AUTH_ENABLED=true)
        run: |
          AUTH_ENABLED=true LOADGEN_API_KEY=ci-secret-key-123 docker compose up -d --build
          npm run test:smoke || (docker compose logs && exit 1)
          docker compose down -v
